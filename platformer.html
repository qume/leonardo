<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Platformer</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #2c3e50;
            font-family: Arial, sans-serif;
            color: white;
        }
        canvas {
            border: 3px solid #34495e;
            background: #87CEEB;
            display: block;
            margin: 20px 0;
            cursor: pointer;
        }
        .controls {
            background: #34495e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .score {
            font-size: 24px;
            font-weight: bold;
            color: #f39c12;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #2980b9;
        }
        .level-info {
            font-size: 20px;
            color: #ecf0f1;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="controls">
        <strong>Controls:</strong> Arrow Keys or WASD to move | Space or W/↑ to jump
    </div>
    <div class="level-info" id="levelInfo">World Map</div>
    <div class="score">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div>
        <button onclick="returnToMap()" id="mapBtn">World Map</button>
        <button onclick="resetLevel()" id="resetBtn" style="display:none;">Reset Level</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state
        let gameState = 'worldmap'; // 'worldmap' or 'playing'
        let currentLevel = null;
        let score = 0;
        let completedLevels = [];

        // Player
        const player = {
            x: 50,
            y: 400,
            width: 30,
            height: 30,
            velocityX: 0,
            velocityY: 0,
            speed: 5,
            jumpPower: 12,
            gravity: 0.5,
            onGround: false,
            color: '#e74c3c'
        };

        // Level definitions
        const levels = {
            1: {
                name: "Grassland Plains",
                bgColor: '#87CEEB',
                spawnX: 50,
                spawnY: 400,
                platforms: [
                    { x: 0, y: 550, width: 800, height: 50, color: '#27ae60' },
                    { x: 150, y: 450, width: 120, height: 20, color: '#2ecc71' },
                    { x: 350, y: 380, width: 100, height: 20, color: '#2ecc71' },
                    { x: 520, y: 310, width: 120, height: 20, color: '#2ecc71' },
                    { x: 300, y: 240, width: 100, height: 20, color: '#2ecc71' },
                    { x: 50, y: 180, width: 120, height: 20, color: '#2ecc71' },
                    { x: 650, y: 450, width: 100, height: 20, color: '#2ecc71' },
                    { x: 600, y: 200, width: 150, height: 20, color: '#2ecc71' }
                ],
                coins: [
                    { x: 200, y: 410, width: 20, height: 20, collected: false },
                    { x: 390, y: 340, width: 20, height: 20, collected: false },
                    { x: 570, y: 270, width: 20, height: 20, collected: false },
                    { x: 340, y: 200, width: 20, height: 20, collected: false },
                    { x: 100, y: 140, width: 20, height: 20, collected: false },
                    { x: 680, y: 160, width: 20, height: 20, collected: false },
                    { x: 700, y: 410, width: 20, height: 20, collected: false }
                ],
                goal: { x: 700, y: 140, width: 40, height: 40, color: '#f39c12' }
            },
            2: {
                name: "Cave Depths",
                bgColor: '#2c2c3e',
                spawnX: 50,
                spawnY: 450,
                platforms: [
                    { x: 0, y: 550, width: 200, height: 50, color: '#5d4e37' },
                    { x: 600, y: 550, width: 200, height: 50, color: '#5d4e37' },
                    { x: 250, y: 480, width: 100, height: 20, color: '#6b5d4f' },
                    { x: 450, y: 480, width: 100, height: 20, color: '#6b5d4f' },
                    { x: 150, y: 400, width: 80, height: 20, color: '#6b5d4f' },
                    { x: 350, y: 350, width: 100, height: 20, color: '#6b5d4f' },
                    { x: 550, y: 400, width: 80, height: 20, color: '#6b5d4f' },
                    { x: 680, y: 320, width: 100, height: 20, color: '#6b5d4f' },
                    { x: 200, y: 280, width: 120, height: 20, color: '#6b5d4f' },
                    { x: 450, y: 220, width: 100, height: 20, color: '#6b5d4f' },
                    { x: 100, y: 150, width: 100, height: 20, color: '#6b5d4f' },
                    { x: 600, y: 180, width: 120, height: 20, color: '#6b5d4f' }
                ],
                coins: [
                    { x: 280, y: 440, width: 20, height: 20, collected: false },
                    { x: 480, y: 440, width: 20, height: 20, collected: false },
                    { x: 170, y: 360, width: 20, height: 20, collected: false },
                    { x: 380, y: 310, width: 20, height: 20, collected: false },
                    { x: 570, y: 360, width: 20, height: 20, collected: false },
                    { x: 710, y: 280, width: 20, height: 20, collected: false },
                    { x: 230, y: 240, width: 20, height: 20, collected: false },
                    { x: 480, y: 180, width: 20, height: 20, collected: false },
                    { x: 130, y: 110, width: 20, height: 20, collected: false },
                    { x: 630, y: 140, width: 20, height: 20, collected: false }
                ],
                goal: { x: 50, y: 90, width: 40, height: 40, color: '#9b59b6' }
            }
        };

        // Current level data (loaded from levels object)
        let platforms = [];
        let coins = [];
        let goal = {};

        // Input handling
        const keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ') e.preventDefault();
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Canvas click handling for world map
        canvas.addEventListener('click', (e) => {
            if (gameState === 'worldmap') {
                const rect = canvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;
                checkLevelClick(clickX, clickY);
            }
        });

        // Level management
        function loadLevel(levelNum) {
            const level = levels[levelNum];
            if (!level) return;

            currentLevel = levelNum;
            gameState = 'playing';

            // Load level data
            platforms = JSON.parse(JSON.stringify(level.platforms));
            coins = JSON.parse(JSON.stringify(level.coins));
            goal = JSON.parse(JSON.stringify(level.goal));

            // Reset player position
            player.x = level.spawnX;
            player.y = level.spawnY;
            player.velocityX = 0;
            player.velocityY = 0;

            // Update UI
            document.getElementById('levelInfo').textContent = level.name;
            document.getElementById('resetBtn').style.display = 'inline-block';
            canvas.style.background = level.bgColor;
        }

        function returnToMap() {
            gameState = 'worldmap';
            currentLevel = null;
            document.getElementById('levelInfo').textContent = 'World Map';
            document.getElementById('resetBtn').style.display = 'none';
            canvas.style.background = '#34495e';
        }

        function resetLevel() {
            if (currentLevel) {
                const level = levels[currentLevel];
                coins = JSON.parse(JSON.stringify(level.coins));
                player.x = level.spawnX;
                player.y = level.spawnY;
                player.velocityX = 0;
                player.velocityY = 0;
            }
        }

        function checkLevelClick(x, y) {
            const levelPositions = {
                1: { x: 200, y: 300, width: 120, height: 120 },
                2: { x: 480, y: 300, width: 120, height: 120 }
            };

            for (let levelNum in levelPositions) {
                const pos = levelPositions[levelNum];
                if (x >= pos.x && x <= pos.x + pos.width &&
                    y >= pos.y && y <= pos.y + pos.height) {
                    loadLevel(parseInt(levelNum));
                    break;
                }
            }
        }

        // Collision detection
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // Update player
        function updatePlayer() {
            // Horizontal movement
            player.velocityX = 0;

            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                player.velocityX = -player.speed;
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.velocityX = player.speed;
            }

            // Jump
            if ((keys['ArrowUp'] || keys['w'] || keys['W'] || keys[' ']) && player.onGround) {
                player.velocityY = -player.jumpPower;
                player.onGround = false;
            }

            // Apply gravity
            player.velocityY += player.gravity;

            // Update position
            player.x += player.velocityX;
            player.y += player.velocityY;

            // Check platform collisions
            player.onGround = false;

            platforms.forEach(platform => {
                if (checkCollision(player, platform)) {
                    // Landing on top
                    if (player.velocityY > 0 && player.y + player.height - player.velocityY <= platform.y) {
                        player.y = platform.y - player.height;
                        player.velocityY = 0;
                        player.onGround = true;
                    }
                    // Hitting from below
                    else if (player.velocityY < 0 && player.y - player.velocityY >= platform.y + platform.height) {
                        player.y = platform.y + platform.height;
                        player.velocityY = 0;
                    }
                    // Side collision
                    else {
                        if (player.velocityX > 0) {
                            player.x = platform.x - player.width;
                        } else if (player.velocityX < 0) {
                            player.x = platform.x + platform.width;
                        }
                    }
                }
            });

            // Keep player in bounds
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Fall off bottom = game over
            if (player.y > canvas.height) {
                resetPlayerPosition();
            }
        }

        // Check coin collection
        function updateCoins() {
            coins.forEach(coin => {
                if (!coin.collected && checkCollision(player, coin)) {
                    coin.collected = true;
                    score += 10;
                    document.getElementById('score').textContent = score;
                }
            });
        }

        // Check goal
        function checkGoal() {
            if (checkCollision(player, goal)) {
                score += 100;
                document.getElementById('score').textContent = score;

                // Mark level as completed
                if (!completedLevels.includes(currentLevel)) {
                    completedLevels.push(currentLevel);
                }

                alert(`Level Complete! 🎉\nScore this level: ${score}\nReturning to World Map...`);
                returnToMap();
            }
        }

        // Draw functions
        function drawPlayer() {
            // Main body - rounded square
            ctx.fillStyle = '#d62828';
            ctx.beginPath();
            ctx.roundRect(player.x, player.y, player.width, player.height, 5);
            ctx.fill();

            // Dark shading on bottom and right
            ctx.fillStyle = 'rgba(139, 0, 0, 0.4)';
            ctx.beginPath();
            ctx.roundRect(player.x + 2, player.y + 15, player.width - 4, player.height - 15, 3);
            ctx.fill();

            // Highlight on top left
            ctx.fillStyle = 'rgba(255, 100, 100, 0.6)';
            ctx.beginPath();
            ctx.ellipse(player.x + 10, player.y + 8, 6, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            // Large expressive eyes
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.ellipse(player.x + 10, player.y + 12, 5, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(player.x + 20, player.y + 12, 5, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // Pupils
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(player.x + 11, player.y + 13, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(player.x + 21, player.y + 13, 3, 0, Math.PI * 2);
            ctx.fill();

            // Eye shine
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(player.x + 12, player.y + 12, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(player.x + 22, player.y + 12, 1.5, 0, Math.PI * 2);
            ctx.fill();

            // Small mouth
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(player.x + 15, player.y + 20, 3, 0, Math.PI);
            ctx.stroke();
        }

        function drawPlatforms() {
            platforms.forEach(platform => {
                ctx.fillStyle = platform.color;
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);

                // Add some texture
                ctx.strokeStyle = '#229954';
                ctx.lineWidth = 2;
                ctx.strokeRect(platform.x, platform.y, platform.width, platform.height);
            });
        }

        function drawCoins() {
            coins.forEach(coin => {
                if (!coin.collected) {
                    ctx.fillStyle = '#f1c40f';
                    ctx.beginPath();
                    ctx.arc(coin.x + coin.width/2, coin.y + coin.height/2, coin.width/2, 0, Math.PI * 2);
                    ctx.fill();

                    // Shine effect
                    ctx.fillStyle = '#fff9e6';
                    ctx.beginPath();
                    ctx.arc(coin.x + coin.width/2 - 3, coin.y + coin.height/2 - 3, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function drawGoal() {
            ctx.fillStyle = goal.color;
            ctx.fillRect(goal.x, goal.y, goal.width, goal.height);

            // Goal icon (star or crystal depending on level)
            ctx.font = 'bold 30px Arial';
            if (currentLevel === 2) {
                ctx.fillText('💎', goal.x + 5, goal.y + 32);
            } else {
                ctx.fillText('⭐', goal.x + 5, goal.y + 32);
            }
        }

        function drawWorldMap() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Title
            ctx.fillStyle = 'white';
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('🗺️ World Map', canvas.width / 2, 80);

            // Instructions
            ctx.font = '18px Arial';
            ctx.fillText('Click a level to start!', canvas.width / 2, 140);

            // Level 1
            const level1X = 200, level1Y = 300;
            ctx.fillStyle = completedLevels.includes(1) ? '#27ae60' : '#3498db';
            ctx.fillRect(level1X, level1Y, 120, 120);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 4;
            ctx.strokeRect(level1X, level1Y, 120, 120);

            ctx.fillStyle = 'white';
            ctx.font = 'bold 24px Arial';
            ctx.fillText('Level 1', level1X + 60, level1Y + 50);
            ctx.font = '16px Arial';
            ctx.fillText('Grassland', level1X + 60, level1Y + 75);
            ctx.fillText('Plains', level1X + 60, level1Y + 95);

            if (completedLevels.includes(1)) {
                ctx.font = '30px Arial';
                ctx.fillText('✓', level1X + 60, level1Y + 118);
            }

            // Level 2
            const level2X = 480, level2Y = 300;
            ctx.fillStyle = completedLevels.includes(2) ? '#27ae60' : '#9b59b6';
            ctx.fillRect(level2X, level2Y, 120, 120);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 4;
            ctx.strokeRect(level2X, level2Y, 120, 120);

            ctx.fillStyle = 'white';
            ctx.font = 'bold 24px Arial';
            ctx.fillText('Level 2', level2X + 60, level2Y + 50);
            ctx.font = '16px Arial';
            ctx.fillText('Cave', level2X + 60, level2Y + 75);
            ctx.fillText('Depths', level2X + 60, level2Y + 95);

            if (completedLevels.includes(2)) {
                ctx.font = '30px Arial';
                ctx.fillText('✓', level2X + 60, level2Y + 118);
            }

            // Stats
            ctx.font = '20px Arial';
            ctx.fillText(`Total Score: ${score} | Completed: ${completedLevels.length}/2`, canvas.width / 2, 500);

            ctx.textAlign = 'left';
        }

        function draw() {
            if (gameState === 'worldmap') {
                drawWorldMap();
            } else {
                // Clear canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw everything
                drawPlatforms();
                drawCoins();
                drawGoal();
                drawPlayer();

                // Instructions
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(10, 10, 280, 30);
                ctx.fillStyle = 'white';
                ctx.font = '14px Arial';
                ctx.textAlign = 'left';
                ctx.fillText('Collect coins and reach the goal!', 20, 30);
            }
        }

        function resetPlayerPosition() {
            if (currentLevel && levels[currentLevel]) {
                player.x = levels[currentLevel].spawnX;
                player.y = levels[currentLevel].spawnY;
                player.velocityX = 0;
                player.velocityY = 0;
            }
        }

        // Game loop
        function gameLoop() {
            if (gameState === 'playing') {
                updatePlayer();
                updateCoins();
                checkGoal();
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start game on world map
        returnToMap();
        gameLoop();
    </script>
</body>
</html>
