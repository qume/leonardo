<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Nested Game Maker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
            overflow: hidden;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border: 2px solid #0f0;
            border-radius: 5px;
            font-size: 14px;
            z-index: 1000;
        }
        #depth-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border: 3px solid #0f0;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 0 20px #0f0;
        }
        #depth-number {
            font-size: 48px;
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
        }
        .level-label {
            font-size: 12px;
            color: #0f0;
            margin-top: 5px;
        }
        .instruction {
            margin: 5px 0;
            color: #0ff;
        }
        .portal-hint {
            position: absolute;
            background: rgba(0, 255, 255, 0.9);
            color: #000;
            padding: 10px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            pointer-events: none;
            z-index: 999;
            display: none;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }
        #transition {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-size: 32px;
            color: #0ff;
            text-shadow: 0 0 20px #0ff;
        }
        .transition-text {
            text-align: center;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas"></canvas>
        <div id="ui">
            <div class="instruction">↑ ↓ ← → : Move</div>
            <div class="instruction">SPACE: Enter Portal</div>
            <div class="instruction">ESC: Exit Game (go back up)</div>
            <div class="instruction" style="color: #f0f; margin-top: 10px;">Find the portal to make a new game!</div>
        </div>
        <div id="depth-indicator">
            <div>GAME DEPTH</div>
            <div id="depth-number">0</div>
            <div class="level-label" id="level-label">Reality</div>
        </div>
        <div class="portal-hint" id="portal-hint">Press SPACE to enter!</div>
        <div id="transition">
            <div class="transition-text" id="transition-text"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Game state
        let gameStack = []; // Stack of game states
        let currentDepth = 0;
        let transitionActive = false;

        // Level labels for different depths
        const levelLabels = [
            "Reality",
            "The Simulation",
            "The Dream",
            "The Thought",
            "The Abstraction",
            "The Concept",
            "The Void",
            "The Beyond",
            "The Infinite",
            "The Eternal"
        ];

        function getLevelLabel(depth) {
            if (depth < levelLabels.length) {
                return levelLabels[depth];
            }
            return `Level ${depth}`;
        }

        // Player
        class Player {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.width = 30;
                this.height = 30;
                this.vx = 0;
                this.vy = 0;
                this.speed = 5;
                this.color = color;
                this.nearPortal = false;
            }

            update(platforms) {
                // Apply velocity
                this.x += this.vx;
                this.y += this.vy;

                // Keep in bounds
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;
                if (this.y < 0) this.y = 0;
                if (this.y + this.height > canvas.height) this.y = canvas.height - this.height;

                // Reset velocity
                this.vx = 0;
                this.vy = 0;
            }

            draw() {
                // Draw player as a little character
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);

                // Eyes
                ctx.fillStyle = '#fff';
                ctx.fillRect(this.x + 7, this.y + 8, 6, 6);
                ctx.fillRect(this.x + 17, this.y + 8, 6, 6);

                // Pupils
                ctx.fillStyle = '#000';
                ctx.fillRect(this.x + 9, this.y + 10, 3, 3);
                ctx.fillRect(this.x + 19, this.y + 10, 3, 3);

                // Smile
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x + 15, this.y + 18, 8, 0, Math.PI);
                ctx.stroke();
            }
        }

        // Portal (represents a game-making computer/portal)
        class Portal {
            constructor(x, y, depth) {
                this.x = x;
                this.y = y;
                this.width = 80;
                this.height = 100;
                this.depth = depth;
                this.pulse = 0;

                // Color changes with depth
                this.hue = (depth * 60) % 360;
            }

            update() {
                this.pulse += 0.1;
            }

            draw() {
                // Glow effect
                const glowSize = 10 + Math.sin(this.pulse) * 5;
                ctx.shadowBlur = glowSize;
                ctx.shadowColor = `hsl(${this.hue}, 100%, 50%)`;

                // Portal frame (like a computer/arcade machine)
                ctx.fillStyle = `hsl(${this.hue}, 50%, 20%)`;
                ctx.fillRect(this.x, this.y, this.width, this.height);

                // Screen
                ctx.fillStyle = `hsl(${this.hue}, 100%, 10%)`;
                ctx.fillRect(this.x + 10, this.y + 10, this.width - 20, this.height - 40);

                // Swirling portal effect on screen
                const centerX = this.x + this.width / 2;
                const centerY = this.y + this.height / 2 - 10;

                for (let i = 0; i < 5; i++) {
                    const radius = 20 - i * 3 + Math.sin(this.pulse + i) * 3;
                    const alpha = 0.3 + i * 0.1;
                    ctx.fillStyle = `hsla(${this.hue + i * 20}, 100%, 50%, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Base
                ctx.fillStyle = `hsl(${this.hue}, 50%, 30%)`;
                ctx.fillRect(this.x, this.y + this.height - 30, this.width, 30);

                ctx.shadowBlur = 0;

                // Label
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 10px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('GAME', centerX, this.y + this.height - 15);
                ctx.fillText('MAKER', centerX, this.y + this.height - 5);
                ctx.textAlign = 'left';
            }

            checkCollision(player) {
                return player.x < this.x + this.width &&
                       player.x + player.width > this.x &&
                       player.y < this.y + this.height &&
                       player.y + player.height > this.y;
            }
        }

        // Game state for each level
        class GameLevel {
            constructor(depth) {
                this.depth = depth;
                this.backgroundColor = `hsl(${(depth * 30) % 360}, 30%, ${10 + (depth * 3) % 20}%)`;

                // Player color changes with depth
                const playerHue = (depth * 80 + 180) % 360;
                this.player = new Player(
                    canvas.width / 2 - 15,
                    canvas.height / 2 - 15,
                    `hsl(${playerHue}, 80%, 50%)`
                );

                // Portal in a random but accessible position
                const portalX = 100 + Math.random() * (canvas.width - 280);
                const portalY = 100 + Math.random() * (canvas.height - 280);
                this.portal = new Portal(portalX, portalY, depth);

                // Decorative elements that change per level
                this.decorations = this.generateDecorations();
            }

            generateDecorations() {
                const decorations = [];
                const count = 10 + this.depth * 2;

                for (let i = 0; i < count; i++) {
                    decorations.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: 2 + Math.random() * 4,
                        hue: (this.depth * 60 + Math.random() * 60) % 360,
                        speed: 0.5 + Math.random() * 1.5,
                        angle: Math.random() * Math.PI * 2
                    });
                }

                return decorations;
            }

            update() {
                this.player.update();
                this.portal.update();

                // Update decorations
                this.decorations.forEach(dec => {
                    dec.angle += dec.speed * 0.01;
                    dec.x += Math.cos(dec.angle) * dec.speed;
                    dec.y += Math.sin(dec.angle) * dec.speed;

                    // Wrap around
                    if (dec.x < 0) dec.x = canvas.width;
                    if (dec.x > canvas.width) dec.x = 0;
                    if (dec.y < 0) dec.y = canvas.height;
                    if (dec.y > canvas.height) dec.y = 0;
                });

                // Check portal collision
                this.player.nearPortal = this.portal.checkCollision(this.player);
            }

            draw() {
                // Background
                ctx.fillStyle = this.backgroundColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Grid effect
                ctx.strokeStyle = `rgba(0, 255, 0, ${0.05 + this.depth * 0.02})`;
                ctx.lineWidth = 1;
                const gridSize = 50;
                for (let x = 0; x < canvas.width; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                for (let y = 0; y < canvas.height; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }

                // Decorations
                this.decorations.forEach(dec => {
                    ctx.fillStyle = `hsl(${dec.hue}, 80%, 50%)`;
                    ctx.beginPath();
                    ctx.arc(dec.x, dec.y, dec.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Portal
                this.portal.draw();

                // Player
                this.player.draw();

                // Level-specific text
                ctx.fillStyle = 'rgba(0, 255, 255, 0.3)';
                ctx.font = 'bold 48px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(`Depth ${this.depth}`, canvas.width / 2, 60);
                ctx.textAlign = 'left';
            }
        }

        // Initialize first level
        let currentLevel = new GameLevel(0);

        // Input handling
        const keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;

            // Enter portal
            if (e.key === ' ' && currentLevel.player.nearPortal && !transitionActive) {
                e.preventDefault();
                enterGame();
            }

            // Exit game
            if (e.key === 'Escape' && !transitionActive) {
                e.preventDefault();
                exitGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Handle player movement
        function handleInput() {
            if (keys['ArrowLeft'] || keys['a']) {
                currentLevel.player.vx = -currentLevel.player.speed;
            }
            if (keys['ArrowRight'] || keys['d']) {
                currentLevel.player.vx = currentLevel.player.speed;
            }
            if (keys['ArrowUp'] || keys['w']) {
                currentLevel.player.vy = -currentLevel.player.speed;
            }
            if (keys['ArrowDown'] || keys['s']) {
                currentLevel.player.vy = currentLevel.player.speed;
            }
        }

        // Enter a new nested game
        function enterGame() {
            transitionActive = true;

            // Save current game state
            gameStack.push(currentLevel);
            currentDepth++;

            // Show transition
            showTransition(`ENTERING GAME ${currentDepth}...`, () => {
                // Create new deeper level
                currentLevel = new GameLevel(currentDepth);
                updateDepthDisplay();
                transitionActive = false;
            });
        }

        // Exit current game and return to parent
        function exitGame() {
            if (currentDepth === 0) {
                // Can't exit the root level
                showMessage("You are at the root level! Go deeper by entering the portal!");
                return;
            }

            transitionActive = true;
            currentDepth--;

            // Show transition
            showTransition(`EXITING TO GAME ${currentDepth}...`, () => {
                // Restore previous game state
                currentLevel = gameStack.pop();
                updateDepthDisplay();
                transitionActive = false;
            });
        }

        // Show transition screen
        function showTransition(text, callback) {
            const transition = document.getElementById('transition');
            const transitionText = document.getElementById('transition-text');

            transitionText.innerHTML = text;
            transition.style.display = 'flex';

            setTimeout(() => {
                transition.style.display = 'none';
                callback();
            }, 1000);
        }

        // Show temporary message
        function showMessage(text) {
            const transition = document.getElementById('transition');
            const transitionText = document.getElementById('transition-text');

            transitionText.innerHTML = text;
            transition.style.display = 'flex';

            setTimeout(() => {
                transition.style.display = 'none';
            }, 1500);
        }

        // Update depth display
        function updateDepthDisplay() {
            document.getElementById('depth-number').textContent = currentDepth;
            document.getElementById('level-label').textContent = getLevelLabel(currentDepth);
        }

        // Update portal hint
        function updatePortalHint() {
            const hint = document.getElementById('portal-hint');

            if (currentLevel.player.nearPortal && !transitionActive) {
                const portal = currentLevel.portal;
                hint.style.display = 'block';
                hint.style.left = (portal.x + portal.width / 2 - 100) + 'px';
                hint.style.top = (portal.y - 40) + 'px';
            } else {
                hint.style.display = 'none';
            }
        }

        // Game loop
        function gameLoop() {
            if (!transitionActive) {
                handleInput();
                currentLevel.update();
                currentLevel.draw();
                updatePortalHint();
            }

            requestAnimationFrame(gameLoop);
        }

        // Start game
        updateDepthDisplay();
        gameLoop();

        // Welcome message
        setTimeout(() => {
            showMessage("Welcome to the Infinite Game Maker!<br>Find the portal to create a new game!");
        }, 500);
    </script>
</body>
</html>
