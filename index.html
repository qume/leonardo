<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Platformer</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #2c3e50;
            font-family: Arial, sans-serif;
            color: white;
        }
        canvas {
            border: 3px solid #34495e;
            background: #87CEEB;
            display: block;
            margin: 20px 0;
        }
        .controls {
            background: #34495e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .score {
            font-size: 24px;
            font-weight: bold;
            color: #f39c12;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <div class="controls">
        <strong>Controls:</strong> Arrow Keys or WASD to move | Space or W/↑ to jump
    </div>
    <div class="score">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <button onclick="resetGame()">Reset Game</button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state
        let score = 0;
        let gameOver = false;

        // Player
        const player = {
            x: 50,
            y: 400,
            width: 30,
            height: 30,
            velocityX: 0,
            velocityY: 0,
            speed: 5,
            jumpPower: 12,
            gravity: 0.5,
            onGround: false,
            color: '#e74c3c'
        };

        // Platforms
        const platforms = [
            { x: 0, y: 550, width: 800, height: 50, color: '#27ae60' }, // Ground
            { x: 150, y: 450, width: 120, height: 20, color: '#2ecc71' },
            { x: 350, y: 380, width: 100, height: 20, color: '#2ecc71' },
            { x: 520, y: 310, width: 120, height: 20, color: '#2ecc71' },
            { x: 300, y: 240, width: 100, height: 20, color: '#2ecc71' },
            { x: 50, y: 180, width: 120, height: 20, color: '#2ecc71' },
            { x: 650, y: 450, width: 100, height: 20, color: '#2ecc71' },
            { x: 600, y: 200, width: 150, height: 20, color: '#2ecc71' }
        ];

        // Collectibles (coins)
        const coins = [
            { x: 200, y: 410, width: 20, height: 20, collected: false },
            { x: 390, y: 340, width: 20, height: 20, collected: false },
            { x: 570, y: 270, width: 20, height: 20, collected: false },
            { x: 340, y: 200, width: 20, height: 20, collected: false },
            { x: 100, y: 140, width: 20, height: 20, collected: false },
            { x: 680, y: 160, width: 20, height: 20, collected: false },
            { x: 700, y: 410, width: 20, height: 20, collected: false }
        ];

        // Goal
        const goal = {
            x: 700,
            y: 140,
            width: 40,
            height: 40,
            color: '#f39c12'
        };

        // Input handling
        const keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ') e.preventDefault(); // Prevent space from scrolling
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Collision detection
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // Update player
        function updatePlayer() {
            // Horizontal movement
            player.velocityX = 0;

            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                player.velocityX = -player.speed;
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.velocityX = player.speed;
            }

            // Jump
            if ((keys['ArrowUp'] || keys['w'] || keys['W'] || keys[' ']) && player.onGround) {
                player.velocityY = -player.jumpPower;
                player.onGround = false;
            }

            // Apply gravity
            player.velocityY += player.gravity;

            // Update position
            player.x += player.velocityX;
            player.y += player.velocityY;

            // Check platform collisions
            player.onGround = false;

            platforms.forEach(platform => {
                if (checkCollision(player, platform)) {
                    // Landing on top
                    if (player.velocityY > 0 && player.y + player.height - player.velocityY <= platform.y) {
                        player.y = platform.y - player.height;
                        player.velocityY = 0;
                        player.onGround = true;
                    }
                    // Hitting from below
                    else if (player.velocityY < 0 && player.y - player.velocityY >= platform.y + platform.height) {
                        player.y = platform.y + platform.height;
                        player.velocityY = 0;
                    }
                    // Side collision
                    else {
                        if (player.velocityX > 0) {
                            player.x = platform.x - player.width;
                        } else if (player.velocityX < 0) {
                            player.x = platform.x + platform.width;
                        }
                    }
                }
            });

            // Keep player in bounds
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Fall off bottom = game over
            if (player.y > canvas.height) {
                resetPlayerPosition();
            }
        }

        // Check coin collection
        function updateCoins() {
            coins.forEach(coin => {
                if (!coin.collected && checkCollision(player, coin)) {
                    coin.collected = true;
                    score += 10;
                    document.getElementById('score').textContent = score;
                }
            });
        }

        // Check goal
        function checkGoal() {
            if (checkCollision(player, goal)) {
                score += 100;
                document.getElementById('score').textContent = score;
                alert('You Win! 🎉 Final Score: ' + score);
                resetGame();
            }
        }

        // Draw functions
        function drawPlayer() {
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Eyes
            ctx.fillStyle = 'white';
            ctx.fillRect(player.x + 8, player.y + 8, 6, 6);
            ctx.fillRect(player.x + 16, player.y + 8, 6, 6);
            ctx.fillStyle = 'black';
            ctx.fillRect(player.x + 10, player.y + 10, 3, 3);
            ctx.fillRect(player.x + 18, player.y + 10, 3, 3);
        }

        function drawPlatforms() {
            platforms.forEach(platform => {
                ctx.fillStyle = platform.color;
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);

                // Add some texture
                ctx.strokeStyle = '#229954';
                ctx.lineWidth = 2;
                ctx.strokeRect(platform.x, platform.y, platform.width, platform.height);
            });
        }

        function drawCoins() {
            coins.forEach(coin => {
                if (!coin.collected) {
                    ctx.fillStyle = '#f1c40f';
                    ctx.beginPath();
                    ctx.arc(coin.x + coin.width/2, coin.y + coin.height/2, coin.width/2, 0, Math.PI * 2);
                    ctx.fill();

                    // Shine effect
                    ctx.fillStyle = '#fff9e6';
                    ctx.beginPath();
                    ctx.arc(coin.x + coin.width/2 - 3, coin.y + coin.height/2 - 3, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function drawGoal() {
            ctx.fillStyle = goal.color;
            ctx.fillRect(goal.x, goal.y, goal.width, goal.height);

            // Star shape
            ctx.fillStyle = '#f39c12';
            ctx.font = 'bold 30px Arial';
            ctx.fillText('⭐', goal.x + 5, goal.y + 32);
        }

        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw everything
            drawPlatforms();
            drawCoins();
            drawGoal();
            drawPlayer();

            // Instructions
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(10, 10, 280, 30);
            ctx.fillStyle = 'white';
            ctx.font = '14px Arial';
            ctx.fillText('Collect coins and reach the star!', 20, 30);
        }

        function resetPlayerPosition() {
            player.x = 50;
            player.y = 400;
            player.velocityX = 0;
            player.velocityY = 0;
        }

        function resetGame() {
            resetPlayerPosition();
            score = 0;
            document.getElementById('score').textContent = score;
            coins.forEach(coin => coin.collected = false);
        }

        // Game loop
        function gameLoop() {
            updatePlayer();
            updateCoins();
            checkGoal();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start game
        gameLoop();
    </script>
</body>
</html>
