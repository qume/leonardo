<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platformer Adventure</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #2c3e50;
            font-family: Arial, sans-serif;
            color: white;
        }
        canvas {
            border: 3px solid #34495e;
            background: #87CEEB;
            display: block;
            margin: 20px 0;
        }
        .controls {
            background: #34495e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .game-info {
            display: flex;
            gap: 30px;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .score {
            color: #f39c12;
        }
        .level {
            color: #3498db;
        }
        .lives {
            color: #e74c3c;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #2980b9;
        }
        .cutscene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
            animation: fadeIn 1s ease-in;
        }
        .cutscene.active {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        .cutscene h1 {
            font-size: 72px;
            color: #f39c12;
            margin: 20px;
            animation: slideUp 1s ease-out, bounce 2s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(243, 156, 18, 0.8);
        }
        .cutscene .message {
            font-size: 32px;
            color: #ecf0f1;
            margin: 20px;
            animation: slideUp 1.5s ease-out;
            text-align: center;
        }
        .cutscene .final-score {
            font-size: 48px;
            color: #2ecc71;
            margin: 30px;
            animation: slideUp 2s ease-out;
            text-shadow: 0 0 15px rgba(46, 204, 113, 0.6);
        }
        .cutscene .trophy {
            font-size: 120px;
            margin: 20px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8));
        }
        .cutscene button {
            font-size: 24px;
            padding: 15px 40px;
            margin-top: 30px;
            animation: slideUp 2.5s ease-out;
        }
        .particle {
            position: fixed;
            pointer-events: none;
            animation: rise 3s ease-out forwards;
        }
        @keyframes rise {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }
        .main-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 2000;
        }
        .main-menu.hidden {
            display: none;
        }
        .main-menu h1 {
            font-size: 96px;
            color: #fff;
            margin: 20px;
            text-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .main-menu .subtitle {
            font-size: 28px;
            color: #ecf0f1;
            margin: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        .main-menu .game-icon {
            font-size: 100px;
            margin: 30px;
            animation: bounce 1s ease-in-out infinite;
        }
        .main-menu .features {
            display: flex;
            gap: 30px;
            margin: 30px 0;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
        }
        .main-menu .feature {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            backdrop-filter: blur(10px);
        }
        .main-menu button {
            font-size: 32px;
            padding: 20px 60px;
            margin-top: 20px;
            background: #f39c12;
            border: none;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
        .main-menu button:hover {
            background: #e67e22;
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }
        .game-container {
            display: none;
        }
        .game-container.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <!-- Main Menu -->
    <div id="mainMenu" class="main-menu">
        <div class="game-icon">🎮</div>
        <h1>PLATFORMER ADVENTURE</h1>
        <div class="subtitle">Can you survive all 5 levels?</div>
        <div class="features">
            <div class="feature">⭐ 5 Challenging Levels</div>
            <div class="feature">🪚 Deadly Sawblades</div>
            <div class="feature">💰 Collect Coins</div>
            <div class="feature">❤️ 3 Lives</div>
        </div>
        <button onclick="startGame()">START GAME</button>
    </div>

    <!-- Game Container -->
    <div id="gameContainer" class="game-container">
        <div class="controls">
            <strong>Controls:</strong> Arrow Keys or WASD to move | Space or W/↑ to jump | Avoid the sawblades! 🪚
        </div>
        <div class="game-info">
            <div class="level">Level: <span id="level">1</span></div>
            <div class="score">Score: <span id="score">0</span></div>
            <div class="lives">Lives: <span id="lives">3</span></div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div>
            <button onclick="resetGame()">Restart Level</button>
            <button onclick="returnToMenu()">Main Menu</button>
        </div>
    </div>

    <!-- Victory Cutscene -->
    <div id="cutscene" class="cutscene">
        <div class="trophy">🏆</div>
        <h1>VICTORY!</h1>
        <div class="message">You conquered all 5 levels!</div>
        <div class="final-score">Final Score: <span id="finalScore">0</span></div>
        <button onclick="closeCutscene()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state
        let score = 0;
        let currentLevel = 1;
        let lives = 3;
        let totalLevels = 5;
        let showingCutscene = false;
        let gameStarted = false;

        // Player
        const player = {
            x: 50,
            y: 400,
            width: 30,
            height: 30,
            velocityX: 0,
            velocityY: 0,
            speed: 5,
            jumpPower: 12,
            gravity: 0.5,
            onGround: false,
            color: '#e74c3c'
        };

        // Level definitions
        const levels = [
            // Level 1 - Easy intro
            {
                platforms: [
                    { x: 0, y: 550, width: 800, height: 50, color: '#27ae60' },
                    { x: 150, y: 450, width: 120, height: 20, color: '#2ecc71' },
                    { x: 350, y: 380, width: 100, height: 20, color: '#2ecc71' },
                    { x: 520, y: 310, width: 120, height: 20, color: '#2ecc71' },
                    { x: 650, y: 450, width: 100, height: 20, color: '#2ecc71' }
                ],
                coins: [
                    { x: 200, y: 410, width: 20, height: 20, collected: false },
                    { x: 390, y: 340, width: 20, height: 20, collected: false },
                    { x: 570, y: 270, width: 20, height: 20, collected: false }
                ],
                sawblades: [
                    { x: 300, y: 520, radius: 25, speed: 2, direction: 1, minX: 250, maxX: 450 }
                ],
                goal: { x: 700, y: 400, width: 40, height: 40 },
                startPos: { x: 50, y: 400 }
            },
            // Level 2 - Moving sawblades
            {
                platforms: [
                    { x: 0, y: 550, width: 800, height: 50, color: '#27ae60' },
                    { x: 100, y: 450, width: 100, height: 20, color: '#2ecc71' },
                    { x: 300, y: 380, width: 100, height: 20, color: '#2ecc71' },
                    { x: 500, y: 310, width: 100, height: 20, color: '#2ecc71' },
                    { x: 350, y: 200, width: 120, height: 20, color: '#2ecc71' }
                ],
                coins: [
                    { x: 140, y: 410, width: 20, height: 20, collected: false },
                    { x: 340, y: 340, width: 20, height: 20, collected: false },
                    { x: 540, y: 270, width: 20, height: 20, collected: false },
                    { x: 390, y: 160, width: 20, height: 20, collected: false }
                ],
                sawblades: [
                    { x: 250, y: 520, radius: 25, speed: 2.5, direction: 1, minX: 200, maxX: 400 },
                    { x: 450, y: 350, radius: 25, speed: 2, direction: 1, minX: 400, maxX: 600 }
                ],
                goal: { x: 400, y: 150, width: 40, height: 40 },
                startPos: { x: 50, y: 400 }
            },
            // Level 3 - Vertical sawblades
            {
                platforms: [
                    { x: 0, y: 550, width: 800, height: 50, color: '#27ae60' },
                    { x: 120, y: 450, width: 80, height: 20, color: '#2ecc71' },
                    { x: 320, y: 450, width: 80, height: 20, color: '#2ecc71' },
                    { x: 520, y: 450, width: 80, height: 20, color: '#2ecc71' },
                    { x: 220, y: 320, width: 100, height: 20, color: '#2ecc71' },
                    { x: 450, y: 280, width: 100, height: 20, color: '#2ecc71' },
                    { x: 650, y: 380, width: 120, height: 20, color: '#2ecc71' }
                ],
                coins: [
                    { x: 150, y: 410, width: 20, height: 20, collected: false },
                    { x: 350, y: 410, width: 20, height: 20, collected: false },
                    { x: 550, y: 410, width: 20, height: 20, collected: false },
                    { x: 260, y: 280, width: 20, height: 20, collected: false },
                    { x: 490, y: 240, width: 20, height: 20, collected: false }
                ],
                sawblades: [
                    { x: 260, y: 350, radius: 25, speed: 2, direction: 1, minY: 320, maxY: 520, axis: 'y' },
                    { x: 420, y: 350, radius: 25, speed: 2.5, direction: 1, minY: 280, maxY: 520, axis: 'y' }
                ],
                goal: { x: 700, y: 330, width: 40, height: 40 },
                startPos: { x: 30, y: 400 }
            },
            // Level 4 - Gauntlet
            {
                platforms: [
                    { x: 0, y: 550, width: 150, height: 50, color: '#27ae60' },
                    { x: 250, y: 550, width: 100, height: 50, color: '#27ae60' },
                    { x: 450, y: 550, width: 100, height: 50, color: '#27ae60' },
                    { x: 650, y: 550, width: 150, height: 50, color: '#27ae60' },
                    { x: 150, y: 420, width: 80, height: 20, color: '#2ecc71' },
                    { x: 350, y: 380, width: 80, height: 20, color: '#2ecc71' },
                    { x: 550, y: 340, width: 80, height: 20, color: '#2ecc71' },
                    { x: 300, y: 250, width: 200, height: 20, color: '#2ecc71' }
                ],
                coins: [
                    { x: 180, y: 380, width: 20, height: 20, collected: false },
                    { x: 380, y: 340, width: 20, height: 20, collected: false },
                    { x: 580, y: 300, width: 20, height: 20, collected: false },
                    { x: 390, y: 210, width: 20, height: 20, collected: false }
                ],
                sawblades: [
                    { x: 200, y: 520, radius: 25, speed: 3, direction: 1, minX: 150, maxX: 250 },
                    { x: 400, y: 520, radius: 25, speed: 3, direction: -1, minX: 350, maxX: 450 },
                    { x: 600, y: 520, radius: 25, speed: 3, direction: 1, minX: 550, maxX: 650 },
                    { x: 280, y: 350, radius: 25, speed: 2.5, direction: 1, minY: 250, maxY: 450, axis: 'y' }
                ],
                goal: { x: 420, y: 200, width: 40, height: 40 },
                startPos: { x: 50, y: 400 }
            },
            // Level 5 - Final Challenge
            {
                platforms: [
                    { x: 0, y: 550, width: 100, height: 50, color: '#27ae60' },
                    { x: 700, y: 550, width: 100, height: 50, color: '#27ae60' },
                    { x: 80, y: 450, width: 80, height: 20, color: '#2ecc71' },
                    { x: 240, y: 400, width: 80, height: 20, color: '#2ecc71' },
                    { x: 400, y: 350, width: 80, height: 20, color: '#2ecc71' },
                    { x: 560, y: 300, width: 80, height: 20, color: '#2ecc71' },
                    { x: 640, y: 450, width: 80, height: 20, color: '#2ecc71' },
                    { x: 300, y: 200, width: 150, height: 20, color: '#2ecc71' },
                    { x: 100, y: 100, width: 100, height: 20, color: '#2ecc71' }
                ],
                coins: [
                    { x: 110, y: 410, width: 20, height: 20, collected: false },
                    { x: 270, y: 360, width: 20, height: 20, collected: false },
                    { x: 430, y: 310, width: 20, height: 20, collected: false },
                    { x: 590, y: 260, width: 20, height: 20, collected: false },
                    { x: 360, y: 160, width: 20, height: 20, collected: false },
                    { x: 140, y: 60, width: 20, height: 20, collected: false }
                ],
                sawblades: [
                    { x: 150, y: 520, radius: 25, speed: 3.5, direction: 1, minX: 100, maxX: 200 },
                    { x: 350, y: 520, radius: 25, speed: 3, direction: 1, minX: 300, maxX: 450 },
                    { x: 550, y: 520, radius: 25, speed: 3.5, direction: -1, minX: 500, maxX: 650 },
                    { x: 180, y: 370, radius: 25, speed: 2.5, direction: 1, minY: 200, maxY: 450, axis: 'y' },
                    { x: 500, y: 370, radius: 25, speed: 2.5, direction: 1, minY: 200, maxY: 450, axis: 'y' }
                ],
                goal: { x: 130, y: 50, width: 40, height: 40 },
                startPos: { x: 30, y: 400 }
            }
        ];

        let platforms = [];
        let coins = [];
        let sawblades = [];
        let goal = {};

        // Input handling
        const keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ') e.preventDefault();
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Load level
        function loadLevel(levelNum) {
            const level = levels[levelNum - 1];
            platforms = JSON.parse(JSON.stringify(level.platforms));
            coins = JSON.parse(JSON.stringify(level.coins));
            sawblades = JSON.parse(JSON.stringify(level.sawblades));
            goal = JSON.parse(JSON.stringify(level.goal));
            player.x = level.startPos.x;
            player.y = level.startPos.y;
            player.velocityX = 0;
            player.velocityY = 0;
        }

        // Collision detection
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // Check circle-rectangle collision (for sawblades)
        function checkCircleRectCollision(circle, rect) {
            const distX = Math.abs(circle.x - rect.x - rect.width / 2);
            const distY = Math.abs(circle.y - rect.y - rect.height / 2);

            if (distX > (rect.width / 2 + circle.radius)) return false;
            if (distY > (rect.height / 2 + circle.radius)) return false;

            if (distX <= (rect.width / 2)) return true;
            if (distY <= (rect.height / 2)) return true;

            const dx = distX - rect.width / 2;
            const dy = distY - rect.height / 2;
            return (dx * dx + dy * dy <= (circle.radius * circle.radius));
        }

        // Update sawblades
        function updateSawblades() {
            sawblades.forEach(saw => {
                if (saw.axis === 'y') {
                    // Vertical movement
                    saw.y += saw.speed * saw.direction;
                    if (saw.y >= saw.maxY || saw.y <= saw.minY) {
                        saw.direction *= -1;
                    }
                } else {
                    // Horizontal movement (default)
                    saw.x += saw.speed * saw.direction;
                    if (saw.x >= saw.maxX || saw.x <= saw.minX) {
                        saw.direction *= -1;
                    }
                }

                // Check collision with player
                if (checkCircleRectCollision(saw, player)) {
                    loseLife();
                }
            });
        }

        // Update player
        function updatePlayer() {
            // Horizontal movement
            player.velocityX = 0;

            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                player.velocityX = -player.speed;
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.velocityX = player.speed;
            }

            // Jump
            if ((keys['ArrowUp'] || keys['w'] || keys['W'] || keys[' ']) && player.onGround) {
                player.velocityY = -player.jumpPower;
                player.onGround = false;
            }

            // Apply gravity
            player.velocityY += player.gravity;

            // Update position
            player.x += player.velocityX;
            player.y += player.velocityY;

            // Check platform collisions
            player.onGround = false;

            platforms.forEach(platform => {
                if (checkCollision(player, platform)) {
                    // Landing on top
                    if (player.velocityY > 0 && player.y + player.height - player.velocityY <= platform.y) {
                        player.y = platform.y - player.height;
                        player.velocityY = 0;
                        player.onGround = true;
                    }
                    // Hitting from below
                    else if (player.velocityY < 0 && player.y - player.velocityY >= platform.y + platform.height) {
                        player.y = platform.y + platform.height;
                        player.velocityY = 0;
                    }
                    // Side collision
                    else {
                        if (player.velocityX > 0) {
                            player.x = platform.x - player.width;
                        } else if (player.velocityX < 0) {
                            player.x = platform.x + platform.width;
                        }
                    }
                }
            });

            // Keep player in bounds (prevent wrapping)
            if (player.x < 0) {
                player.x = 0;
                player.velocityX = 0;
            }
            if (player.x + player.width > canvas.width) {
                player.x = canvas.width - player.width;
                player.velocityX = 0;
            }

            // Fall off bottom = lose life
            if (player.y > canvas.height) {
                loseLife();
            }
        }

        // Check coin collection
        function updateCoins() {
            coins.forEach(coin => {
                if (!coin.collected && checkCollision(player, coin)) {
                    coin.collected = true;
                    score += 10;
                    document.getElementById('score').textContent = score;
                }
            });
        }

        // Check goal
        function checkGoal() {
            if (checkCollision(player, goal)) {
                score += 100;
                document.getElementById('score').textContent = score;

                if (currentLevel < totalLevels) {
                    currentLevel++;
                    document.getElementById('level').textContent = currentLevel;
                    loadLevel(currentLevel);
                    alert('Level Complete! 🎉 Moving to Level ' + currentLevel);
                } else {
                    // Show victory cutscene
                    showVictoryCutscene();
                }
            }
        }

        // Show victory cutscene with particles
        function showVictoryCutscene() {
            showingCutscene = true;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('cutscene').classList.add('active');

            // Create particle effects
            createParticles();
        }

        // Create particle effects
        function createParticles() {
            const particles = ['⭐', '✨', '🎉', '🎊', '💫', '🌟'];
            const colors = ['#f39c12', '#e74c3c', '#3498db', '#2ecc71', '#9b59b6'];

            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.textContent = particles[Math.floor(Math.random() * particles.length)];
                    particle.style.left = Math.random() * window.innerWidth + 'px';
                    particle.style.bottom = '-50px';
                    particle.style.fontSize = (20 + Math.random() * 30) + 'px';
                    particle.style.color = colors[Math.floor(Math.random() * colors.length)];
                    particle.style.animationDuration = (2 + Math.random() * 2) + 's';

                    document.body.appendChild(particle);

                    setTimeout(() => {
                        particle.remove();
                    }, 4000);
                }, i * 100);
            }
        }

        // Close cutscene and return to menu
        function closeCutscene() {
            document.getElementById('cutscene').classList.remove('active');
            showingCutscene = false;
            returnToMenu();
        }

        // Lose a life
        function loseLife() {
            lives--;
            document.getElementById('lives').textContent = lives;

            if (lives <= 0) {
                alert('Game Over! 💀 Final Score: ' + score);
                returnToMenu();
            } else {
                // Respawn at start position
                const level = levels[currentLevel - 1];
                player.x = level.startPos.x;
                player.y = level.startPos.y;
                player.velocityX = 0;
                player.velocityY = 0;
            }
        }

        // Draw functions
        function drawPlayer() {
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Eyes
            ctx.fillStyle = 'white';
            ctx.fillRect(player.x + 8, player.y + 8, 6, 6);
            ctx.fillRect(player.x + 16, player.y + 8, 6, 6);
            ctx.fillStyle = 'black';
            ctx.fillRect(player.x + 10, player.y + 10, 3, 3);
            ctx.fillRect(player.x + 18, player.y + 10, 3, 3);
        }

        function drawPlatforms() {
            platforms.forEach(platform => {
                ctx.fillStyle = platform.color;
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                ctx.strokeStyle = '#229954';
                ctx.lineWidth = 2;
                ctx.strokeRect(platform.x, platform.y, platform.width, platform.height);
            });
        }

        function drawCoins() {
            coins.forEach(coin => {
                if (!coin.collected) {
                    ctx.fillStyle = '#f1c40f';
                    ctx.beginPath();
                    ctx.arc(coin.x + coin.width/2, coin.y + coin.height/2, coin.width/2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff9e6';
                    ctx.beginPath();
                    ctx.arc(coin.x + coin.width/2 - 3, coin.y + coin.height/2 - 3, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function drawSawblades() {
            sawblades.forEach(saw => {
                // Draw sawblade body
                ctx.fillStyle = '#95a5a6';
                ctx.beginPath();
                ctx.arc(saw.x, saw.y, saw.radius, 0, Math.PI * 2);
                ctx.fill();

                // Draw teeth
                const teeth = 12;
                ctx.fillStyle = '#7f8c8d';
                for (let i = 0; i < teeth; i++) {
                    const angle = (Math.PI * 2 / teeth) * i + Date.now() / 200;
                    const x1 = saw.x + Math.cos(angle) * saw.radius * 0.7;
                    const y1 = saw.y + Math.sin(angle) * saw.radius * 0.7;
                    const x2 = saw.x + Math.cos(angle) * saw.radius * 1.2;
                    const y2 = saw.y + Math.sin(angle) * saw.radius * 1.2;

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.lineTo(
                        saw.x + Math.cos(angle + 0.2) * saw.radius,
                        saw.y + Math.sin(angle + 0.2) * saw.radius
                    );
                    ctx.closePath();
                    ctx.fill();
                }

                // Center
                ctx.fillStyle = '#34495e';
                ctx.beginPath();
                ctx.arc(saw.x, saw.y, saw.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawGoal() {
            ctx.fillStyle = goal.color;
            ctx.fillRect(goal.x, goal.y, goal.width, goal.height);
            ctx.fillStyle = '#f39c12';
            ctx.font = 'bold 30px Arial';
            ctx.fillText('⭐', goal.x + 5, goal.y + 32);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawPlatforms();
            drawCoins();
            drawSawblades();
            drawGoal();
            drawPlayer();

            // Level indicator
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(10, 10, 220, 30);
            ctx.fillStyle = 'white';
            ctx.font = '14px Arial';
            ctx.fillText('Avoid sawblades! Reach the star!', 20, 30);
        }

        // Start game from main menu
        function startGame() {
            gameStarted = true;
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('gameContainer').classList.add('active');
            resetGame();
        }

        function resetGame() {
            currentLevel = 1;
            score = 0;
            lives = 3;
            document.getElementById('level').textContent = currentLevel;
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            loadLevel(currentLevel);
        }

        // Return to main menu
        function returnToMenu() {
            gameStarted = false;
            document.getElementById('mainMenu').classList.remove('hidden');
            document.getElementById('gameContainer').classList.remove('active');
            document.getElementById('cutscene').classList.remove('active');
            showingCutscene = false;
        }

        // Game loop
        function gameLoop() {
            if (gameStarted && !showingCutscene) {
                updatePlayer();
                updateSawblades();
                updateCoins();
                checkGoal();
                draw();
            }
            requestAnimationFrame(gameLoop);
        }

        // Initialize game loop (but don't start the game)
        gameLoop();
    </script>
</body>
</html>
