<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highway Racer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial Black', sans-serif;
            background: linear-gradient(to bottom, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }
        canvas {
            display: block;
            background: #2d2d2d;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }
        #speed {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #00ff00;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff00, 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }
        .speed-label {
            font-size: 16px;
            color: white;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 20px;
            border: 4px solid #ff0000;
            text-align: center;
            display: none;
            z-index: 100;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
        }
        #game-over h1 {
            color: #ff0000;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ff0000;
        }
        #game-over p {
            color: white;
            font-size: 24px;
            margin: 10px 0;
        }
        #game-over button {
            background: linear-gradient(to bottom, #00ff00, #00aa00);
            color: black;
            border: none;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0, 255, 0, 0.3);
            transition: transform 0.1s;
        }
        #game-over button:hover {
            transform: scale(1.05);
        }
        #game-over button:active {
            transform: scale(0.95);
        }
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 20px;
            border: 4px solid #00ff00;
            text-align: center;
            z-index: 100;
            color: white;
        }
        #instructions h1 {
            color: #00ff00;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #00ff00;
        }
        #instructions p {
            font-size: 20px;
            margin: 15px 0;
            line-height: 1.5;
        }
        #instructions button {
            background: linear-gradient(to bottom, #00ff00, #00aa00);
            color: black;
            border: none;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0, 255, 0, 0.3);
        }
        .key {
            display: inline-block;
            background: #333;
            padding: 5px 10px;
            border-radius: 5px;
            border: 2px solid #00ff00;
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas" width="800" height="600"></canvas>
        <div id="ui">
            <div>SCORE: <span id="score">0</span></div>
            <div>DISTANCE: <span id="distance">0</span>m</div>
        </div>
        <div id="speed">
            <div class="speed-label">SPEED</div>
            <div id="speed-value">0</div>
            <div class="speed-label">km/h</div>
        </div>
        <div id="instructions">
            <h1>HIGHWAY RACER</h1>
            <p><span class="key">←</span> <span class="key">→</span> Steer Left/Right</p>
            <p><span class="key">↑</span> Accelerate</p>
            <p><span class="key">↓</span> Brake</p>
            <p style="margin-top: 30px; color: #ffff00;">Dodge traffic and collect coins!</p>
            <button onclick="startGame()">START GAME</button>
        </div>
        <div id="game-over">
            <h1>GAME OVER!</h1>
            <p>Final Score: <span id="final-score">0</span></p>
            <p>Distance: <span id="final-distance">0</span>m</p>
            <button onclick="restartGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Game state
        let gameRunning = false;
        let score = 0;
        let distance = 0;
        let gameSpeed = 5;
        let maxSpeed = 15;

        // Player car
        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 150,
            width: 50,
            height: 80,
            speed: 0,
            maxSpeed: 8,
            acceleration: 0.3,
            deceleration: 0.2,
            turnSpeed: 6,
            color: '#ff0000'
        };

        // Road
        const road = {
            x: canvas.width / 2,
            width: 400,
            leftEdge: function() { return this.x - this.width / 2; },
            rightEdge: function() { return this.x + this.width / 2; },
            stripeOffset: 0
        };

        // Other cars
        let cars = [];
        let carSpawnTimer = 0;
        let carSpawnInterval = 100;

        // Coins
        let coins = [];
        let coinSpawnTimer = 0;
        let coinSpawnInterval = 150;

        // Input
        const keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Car colors
        const carColors = ['#0000ff', '#00ff00', '#ffff00', '#ff00ff', '#00ffff', '#ffffff', '#ffa500'];

        function getRandomLane() {
            const lanes = [
                road.leftEdge() + 50,
                road.x - 50,
                road.x + 50,
                road.rightEdge() - 100
            ];
            return lanes[Math.floor(Math.random() * lanes.length)];
        }

        function spawnCar() {
            const lane = getRandomLane();
            cars.push({
                x: lane,
                y: -100,
                width: 50,
                height: 80,
                speed: 3 + Math.random() * 3,
                color: carColors[Math.floor(Math.random() * carColors.length)]
            });
        }

        function spawnCoin() {
            const lane = getRandomLane();
            coins.push({
                x: lane + 15,
                y: -50,
                size: 20,
                collected: false,
                rotation: 0
            });
        }

        function drawRoad() {
            // Sky/background
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#1a1a2e');
            gradient.addColorStop(1, '#3a3a5e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grass
            ctx.fillStyle = '#1a4d1a';
            ctx.fillRect(0, 0, road.leftEdge(), canvas.height);
            ctx.fillRect(road.rightEdge(), 0, canvas.width - road.rightEdge(), canvas.height);

            // Road edges
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(road.leftEdge(), 0, 10, canvas.height);
            ctx.fillRect(road.rightEdge() - 10, 0, 10, canvas.height);

            // Road surface
            ctx.fillStyle = '#404040';
            ctx.fillRect(road.leftEdge() + 10, 0, road.width - 20, canvas.height);

            // Road stripes
            ctx.fillStyle = '#ffff00';
            const stripeHeight = 40;
            const stripeGap = 30;
            for (let y = road.stripeOffset - stripeHeight; y < canvas.height; y += stripeHeight + stripeGap) {
                // Center line
                ctx.fillRect(road.x - 3, y, 6, stripeHeight);
                // Lane dividers
                ctx.fillRect(road.x - road.width / 4 - 3, y, 6, stripeHeight);
                ctx.fillRect(road.x + road.width / 4 - 3, y, 6, stripeHeight);
            }

            // Update stripe offset
            road.stripeOffset += gameSpeed;
            if (road.stripeOffset > stripeHeight + stripeGap) {
                road.stripeOffset = 0;
            }
        }

        function drawCar(car) {
            ctx.save();

            // Car body
            ctx.fillStyle = car.color;
            ctx.fillRect(car.x, car.y, car.width, car.height);

            // Car outline
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.strokeRect(car.x, car.y, car.width, car.height);

            // Windows
            ctx.fillStyle = 'rgba(100, 150, 200, 0.5)';
            ctx.fillRect(car.x + 5, car.y + 10, car.width - 10, 20);
            ctx.fillRect(car.x + 5, car.y + 35, car.width - 10, 20);

            // Headlights/taillights
            if (car === player) {
                // Taillights for player
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(car.x + 5, car.y + car.height - 10, 15, 8);
                ctx.fillRect(car.x + car.width - 20, car.y + car.height - 10, 15, 8);
            } else {
                // Headlights for other cars
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(car.x + 5, car.y, 15, 8);
                ctx.fillRect(car.x + car.width - 20, car.y, 15, 8);
            }

            ctx.restore();
        }

        function drawCoin(coin) {
            ctx.save();
            ctx.translate(coin.x + coin.size / 2, coin.y + coin.size / 2);
            ctx.rotate(coin.rotation);

            // Coin
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(0, 0, coin.size / 2, 0, Math.PI * 2);
            ctx.fill();

            // Shine
            ctx.fillStyle = '#ffed4e';
            ctx.beginPath();
            ctx.arc(-3, -3, coin.size / 4, 0, Math.PI * 2);
            ctx.fill();

            // Border
            ctx.strokeStyle = '#b8860b';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, coin.size / 2, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();

            coin.rotation += 0.1;
        }

        function updatePlayer() {
            // Acceleration
            if (keys['ArrowUp']) {
                player.speed = Math.min(player.speed + player.acceleration, player.maxSpeed);
                gameSpeed = Math.min(gameSpeed + 0.1, maxSpeed);
            } else {
                player.speed = Math.max(player.speed - player.deceleration, 0);
                gameSpeed = Math.max(gameSpeed - 0.05, 5);
            }

            // Braking
            if (keys['ArrowDown']) {
                player.speed = Math.max(player.speed - player.deceleration * 2, -player.maxSpeed / 2);
                gameSpeed = Math.max(gameSpeed - 0.2, 2);
            }

            // Steering
            if (keys['ArrowLeft']) {
                player.x -= player.turnSpeed;
            }
            if (keys['ArrowRight']) {
                player.x += player.turnSpeed;
            }

            // Keep player on road
            if (player.x < road.leftEdge() + 15) {
                player.x = road.leftEdge() + 15;
            }
            if (player.x + player.width > road.rightEdge() - 15) {
                player.x = road.rightEdge() - 15 - player.width;
            }

            // Update distance
            distance += gameSpeed / 10;
        }

        function updateCars() {
            // Move cars
            cars = cars.filter(car => {
                car.y += gameSpeed + car.speed;
                return car.y < canvas.height + 100;
            });

            // Spawn new cars
            carSpawnTimer++;
            if (carSpawnTimer > carSpawnInterval) {
                spawnCar();
                carSpawnTimer = 0;
                // Make it harder over time
                carSpawnInterval = Math.max(50, 100 - Math.floor(distance / 100));
            }

            // Check collisions
            cars.forEach(car => {
                if (checkCollision(player, car)) {
                    endGame();
                }
            });
        }

        function updateCoins() {
            // Move coins
            coins.forEach(coin => {
                coin.y += gameSpeed;
            });

            // Remove off-screen coins
            coins = coins.filter(coin => coin.y < canvas.height + 50);

            // Spawn new coins
            coinSpawnTimer++;
            if (coinSpawnTimer > coinSpawnInterval) {
                spawnCoin();
                coinSpawnTimer = 0;
            }

            // Check collection
            coins.forEach(coin => {
                if (!coin.collected && checkCoinCollision(player, coin)) {
                    coin.collected = true;
                    score += 10;
                }
            });

            // Remove collected coins
            coins = coins.filter(coin => !coin.collected);
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function checkCoinCollision(car, coin) {
            const carCenterX = car.x + car.width / 2;
            const carCenterY = car.y + car.height / 2;
            const coinCenterX = coin.x + coin.size / 2;
            const coinCenterY = coin.y + coin.size / 2;

            const dx = carCenterX - coinCenterX;
            const dy = carCenterY - coinCenterY;
            const distance = Math.sqrt(dx * dx + dy * dy);

            return distance < (car.width / 2 + coin.size / 2);
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('distance').textContent = Math.floor(distance);
            document.getElementById('speed-value').textContent = Math.floor(gameSpeed * 10);
        }

        function draw() {
            drawRoad();

            // Draw coins
            coins.forEach(coin => drawCoin(coin));

            // Draw cars
            cars.forEach(car => drawCar(car));
            drawCar(player);
        }

        function gameLoop() {
            if (!gameRunning) return;

            updatePlayer();
            updateCars();
            updateCoins();
            draw();
            updateUI();

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            document.getElementById('instructions').style.display = 'none';
            gameRunning = true;
            resetGame();
            gameLoop();
        }

        function resetGame() {
            score = 0;
            distance = 0;
            gameSpeed = 5;
            player.x = canvas.width / 2 - 25;
            player.y = canvas.height - 150;
            player.speed = 0;
            cars = [];
            coins = [];
            carSpawnTimer = 0;
            coinSpawnTimer = 0;
        }

        function endGame() {
            gameRunning = false;
            document.getElementById('final-score').textContent = score;
            document.getElementById('final-distance').textContent = Math.floor(distance);
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            document.getElementById('game-over').style.display = 'none';
            gameRunning = true;
            resetGame();
            gameLoop();
        }

        // Initial draw
        draw();
    </script>
</body>
</html>
